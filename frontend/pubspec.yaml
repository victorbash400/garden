name: garden_flutter
description: Garden macOS application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  garden_client:
    path: ../client
  serverpod_flutter: ^4.0.3
  serverpod_auth_idp_flutter: ^4.0.3
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.21
  window_manager: ^0.5.2
  shared_preferences: ^2.5.5
  file_selector: ^1.1.0
  passkeys: ^2.23.1
  local_auth: ^3.0.2
  serverpod_auth_idp_client: ^4.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/garden.svg
    - assets/folder-closed.svg
    - assets/folder-open.svg
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
