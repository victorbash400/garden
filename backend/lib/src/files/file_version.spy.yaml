class: FileVersion
table: file_version
fields:
  nodeId: int, relation(parent=file_node)
  authorId: String
  baseVersion: int
  size: int
  chunkCount: int
  objectPath: String?
  uploadId: String?
  partSize: int?
  committed: bool, default=false
  aborted: bool, default=false
  createdAt: DateTime
indexes:
  version_node:
    fields: nodeId, committed, createdAt
